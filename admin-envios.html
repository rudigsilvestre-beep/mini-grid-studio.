<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Envios | Mini Grid Studio</title><style>body{margin:0;background:#f7f7f5;color:#151515;font:15px Arial,sans-serif}header{background:#111;color:#fff;padding:26px 6%;letter-spacing:2px}main{max-width:1050px;margin:35px auto;padding:0 20px}h1{font-size:32px}button,a.action{border:0;border-radius:6px;padding:12px 17px;background:#171717;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.45;cursor:not-allowed}.card{background:#fff;border:1px solid #e3e3e3;border-radius:12px;padding:23px;margin:16px 0}.muted{color:#666;font-size:13px}pre{white-space:pre-wrap;font:14px Arial;line-height:1.7}.row{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.status{padding:7px 11px;background:#eee;border-radius:15px;font-size:12px}#orders{margin-top:25px}</style></head><body><header>MINI GRID STUDIO / ADMINISTRAÇÃO</header><main><h1>Preparação de envios</h1><p class="muted">Pedidos com pagamento aprovado. A contratação de frete permanece manual e não é realizada por esta tela.</p><section class="card" id="login"><p>Entre com a conta Google cadastrada como administradora.</p><button id="signIn">Entrar com Google</button></section><section id="panel" hidden><div class="row"><button id="reload">Atualizar pedidos</button><button id="signOut">Sair</button></div><div id="orders"></div></section><p id="message" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const client=supabase.createClient('https://vensjehtucothpvzteqj.supabase.co','sb_publishable_3SfWVRpUaPLS3drZZxUWTA_67NwGOmw');
const $=id=>document.getElementById(id),orders=$('orders'),msg=$('message');
$('signIn').onclick=async()=>{const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/admin-envios.html'}});if(error)msg.textContent=error.message};
$('signOut').onclick=async()=>{await client.auth.signOut();location.reload()};
$('reload').onclick=load;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
async function load(){orders.replaceChildren();msg.textContent='Carregando pedidos...';const {data:{session}}=await client.auth.getSession();$('login').hidden=!!session;$('panel').hidden=!session;if(!session){msg.textContent='';return}try{const r=await fetch('/api/admin-shipping-orders',{headers:{Authorization:'Bearer '+session.access_token}});const data=await r.json();if(!r.ok)throw Error(data.error||'Erro ao carregar pedidos');msg.textContent='';if(!data.orders.length){orders.append(el('p','Nenhum pedido aprovado no momento.'));return}data.orders.forEach(o=>{const card=el('article',undefined,'card'),top=el('div',undefined,'row');top.append(el('strong','Pedido '+o.id.slice(0,8)),el('span',o.shipping_label_status||'Etiqueta pendente','status'));card.append(top,el('p','Transportadora: '+(o.shipping_service||'Não informada')));card.append(el('p',o.shipping_service_id?'Código do serviço: '+o.shipping_service_id:'Pedido antigo: conferir serviço de frete manualmente.','muted'));if(o.missing_label_fields&&o.missing_label_fields.length){card.append(el('p','Antes de gerar etiqueta, completar: '+o.missing_label_fields.join('; '),'muted'))}else if(o.ready_for_label){card.append(el('p','Dados básicos conferidos. Emissão de etiqueta ainda não ativada.','muted'))}const a=o.shipping_address||{};const address=[a.street,a.number,a.complement,a.district,a.city,a.state,a.postal_code].filter(Boolean).join(', ');card.append(el('pre',address||'Endereço não disponível'));card.append(el('p','Frete pago: '+new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format((o.shipping_cents||0)/100),'muted'));if(o.tracking_code)card.append(el('p','Rastreio: '+o.tracking_code));const b=el('button','Conferir envio');b.onclick=()=>{const details=[o.id,'Serviço: '+(o.shipping_service||''),'Código Melhor Envio: '+(o.shipping_service_id||'Conferir'), 'Destinatário: '+(a.name||''),'Telefone: '+(a.phone||''),'CPF/CNPJ: '+(a.document||'Conferir'),address,'Pacote: 30 × 25 × 8 cm; 525 g'].join('\n');navigator.clipboard.writeText(details).then(()=>{msg.textContent='Dados do envio copiados. Confira e contrate a etiqueta no Melhor Envio.'}).catch(()=>{msg.textContent='Não foi possível copiar os dados.'})};card.append(b);const labelButton=el('button','Gerar etiqueta — aguardando configuração');labelButton.disabled=true;labelButton.title='A emissão será habilitada somente após configuração completa e confirmação do valor';labelButton.style.marginLeft='8px';labelButton.style.marginTop='8px';card.append(labelButton);orders.append(card)})}catch(e){msg.textContent=e.message}}
client.auth.onAuthStateChange(()=>{load()});load();
</script></body></html>
